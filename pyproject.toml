[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "image-style-transfer"
version = "0.1.0"
description = "Optimization, AdaIN, and transformer image style transfer experiments."
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "torchvision>=0.17",
  "Pillow>=10.0",
  "numpy>=1.26",
  "tqdm>=4.66",
  "pandas>=2.0",
  "matplotlib>=3.8",
]

[project.scripts]
style-transfer = "style_transfer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

